<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntentLock | Proof of check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2319C3B1'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='%230A1424'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A1424;--panel:#13243B;--line:#243E5E;--text:#ECF1F7;--muted:#9AAEC4;--faint:#6D839E;--teal:#19C3B1;--amber:#F5A524;--orange:#FF8A4C;--red:#FF6B5B;--sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 380px at 80% -8%,rgba(25,195,177,.11),transparent 62%),var(--ink);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}.muted{color:var(--muted)}
.top{border-bottom:1px solid var(--line)}.top div{max-width:820px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:12px}
.top b{font-weight:600;font-size:17px}.top span{color:var(--muted);font-size:13px}
main{max-width:820px;margin:0 auto;padding:32px 24px 80px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em}.lead{color:var(--muted);margin:8px 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.verdict{display:flex;gap:16px;padding:18px;border-radius:14px;border:1px solid var(--line);border-left-width:5px}
.verdict h2{font-size:22px;font-weight:600}.verdict p{color:var(--muted);margin-top:4px}
.vi{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%}
.ok{border-color:var(--teal)}.verdict.ok{background:rgba(25,195,177,.08)}.ok .vi{background:rgba(25,195,177,.16);color:var(--teal)}
.warn{border-color:var(--amber)}.verdict.warn{background:rgba(245,165,36,.08)}.warn .vi{background:rgba(245,165,36,.16);color:var(--amber)}
.bad{border-color:var(--red)}.verdict.bad{background:rgba(255,107,91,.08)}.bad .vi{background:rgba(255,107,91,.16);color:var(--red)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;background:rgba(91,164,255,.16);color:#7DB7FF;margin-left:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:20px 0 0;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--panel);padding:11px 14px}.facts .full{grid-column:1/-1}.facts dt{font-size:12.5px;color:var(--faint)}.facts dd{margin:2px 0 0}
h3{font-size:16px;font-weight:600;margin:28px 0 8px}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fi{padding:12px 14px;background:var(--ink);border:1px solid var(--line);border-left-width:4px;border-radius:12px}
.fi b{font-weight:500}.fi p{color:var(--muted);font-size:13.5px;margin-top:2px}
.fi.critical{border-left-color:var(--red)}.fi.high{border-left-color:var(--amber)}.fi.medium{border-left-color:var(--orange)}.fi.info{border-left-color:var(--teal)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 18px}.tl li::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid var(--ink)}
.tl small{display:block;color:var(--faint);font-size:12.5px}.tl .mono{color:var(--faint);display:block;margin-top:2px}
.chain{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;margin-left:8px}
.chain.ok{background:rgba(25,195,177,.16);color:var(--teal)}.chain.bad{background:rgba(255,107,91,.16);color:var(--red)}
.foot{margin-top:28px;color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div class="top"><div>
  <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#19C3B1"/><path d="M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z" fill="#0A1424"/></svg>
  <b>IntentLock</b><span>Proof of check</span>
</div></div>
<main>
  <h1>Proof of payment check</h1>
  <p class="lead">What was checked, who confirmed it, and what happened on-chain. This is an audit record, not a guarantee that a payment is safe.</p>
  <div id="out" class="card">Loading…</div>
  <p class="foot">Each event in the audit trail stores a hash of the one before it, so edits to the record can be detected.</p>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON = {ok: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>', warn: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>', bad: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>'};
const ico = k => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const L = {approved: ["Approved to pay", "ok"], approved_verified: ["Approved after verification", "ok"], approved_swapped: ["Approved: paid the verified wallet", "ok"],
  needs_verification: ["Needed verification before paying", "warn"], withheld: ["Approval withheld", "bad"], rejected: ["Rejected", "bad"]};
const S = {VERIFIED: ["Payment verified on-chain", "ok"], PENDING: ["Waiting for confirmations", "warn"], PARTIAL: ["Partial payment", "warn"],
  MISMATCH: ["Paid to the wrong destination", "bad"], FAKE_TOKEN: ["Fake token, not real USDT", "bad"], NOT_FOUND: ["Transaction not found", "warn"], FAILED: ["Transaction failed", "bad"]};
const fl = list => `<ul class="fl">${list.map(f => `<li class="fi ${esc(f.severity)}"><b>${esc(f.title)}</b><p>${esc(f.detail)}</p></li>`).join("")}</ul>`;
const when = s => { const d = new Date(s); return isNaN(d) ? s : d.toLocaleString([], {dateStyle: "medium", timeStyle: "short"}); };
(async () => {
  const res = await fetch("/api/proof/" + location.pathname.split("/").pop());
  if (!res.ok) { document.getElementById("out").textContent = "This proof could not be found."; return; }
  const c = await res.json(), [label, k] = L[c.status] || [c.status, "warn"];
  let h = `<div class="verdict ${k}"><span class="vi">${ico(k)}</span><div><h2>${esc(label)}</h2><p>${esc(c.explanation)}</p></div></div>
  <dl class="facts"><div><dt>Supplier</dt><dd>${esc(c.supplier_name)}</dd></div><div><dt>Invoice</dt><dd>${esc(c.invoice_number || "n/a")}</dd></div>
  <div><dt>Amount</dt><dd>${c.amount != null ? Number(c.amount).toLocaleString() : "n/a"} ${esc(c.currency || "")}</dd></div><div><dt>Checked</dt><dd>${esc(when(c.created_at))}</dd></div>
  <div class="full"><dt>Destination (${esc(c.network || "unknown")})</dt><dd class="mono">${esc(c.destination || "n/a")}</dd></div></dl>
  <h3>Checks performed</h3>${fl(c.findings)}`;
  if (c.settlement) {
    const s = c.settlement, [sl, sk] = S[s.status] || [s.status, "warn"];
    h += `<h3>On-chain settlement</h3><div class="verdict ${sk}"><span class="vi">${ico(sk)}</span><div><h2>${esc(sl)}${s.simulated ? '<span class="badge">Simulated</span>' : ""}</h2>
      <p>${s.confirmations} of ${s.required_confirmations} confirmations. ${Number(s.received).toLocaleString()} USDT received.</p><p class="mono">${esc(s.txid)}</p></div></div><div style="margin-top:10px">${fl(s.findings)}</div>`;
  }
  h += `<h3>Audit trail<span class="chain ${c.audit_ok ? "ok" : "bad"}">${c.audit_ok ? "Hash chain intact" : "Hash chain broken"}</span></h3><ol class="tl">` +
    c.audit.map(e => `<li><b>${esc(e.type.replaceAll("_", " "))}</b><small>${esc(when(e.ts))}</small><span class="mono">${esc(e.hash)}</span></li>`).join("") + "</ol>";
  document.getElementById("out").innerHTML = h;
})();
</script>
</body>
</html>
